[workspace]
members = ["webgraph", "webgraph-swh", "webgraph-py-common"]
resolver = "3"

[workspace.dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module"] }
numpy = "0.29.0"
rayon = "1.11.0"
dary_heap = "0.3.8"
dsi-bitstream = "0.10.1"
sux = "0.15.0"
webgraph = "0.7.0"

[profile.release]
opt-level = 3
overflow-checks = false
debug = true
debug-assertions = false
