[package]
name = "webgraph-swh-py"
version = "0.2.0"
edition = "2024"
authors = [
	"Dario Moschetti <dariomos.dm@gmail.com>",
	"Sebastiano Vigna <sebastiano.vigna@unimi.it>",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/vigna/webgraph-py"

[lib]
name = "_webgraph_swh"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
numpy = { workspace = true }
rayon = { workspace = true }
# sux and epserde must match the versions used by swh-graph
sux = "0.12.2"
swh-graph = "11.0.0"
epserde = "0.12.1"
webgraph-py-common = { path = "../webgraph-py-common" }
