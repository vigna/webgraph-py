[package]
name = "webgraph-py"
version = "0.1.4"
edition = "2024"
authors = [
	"Dario Moschetti <dariomos.dm@gmail.com>",
	"Sebastiano Vigna <sebastiano.vigna@unimi.it>",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/vigna/webgraph-py"

[lib]
name = "_webgraph"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
numpy = { workspace = true }
rayon = { workspace = true }
dsi-bitstream = { workspace = true }
sux = { workspace = true }
webgraph = { workspace = true }
webgraph-py-common = { path = "../webgraph-py-common" }
